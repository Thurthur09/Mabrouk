<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Mabrouk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%83%8F%3C/text%3E%3C/svg%3E" />
    <style>
      /* Pas de marge par defaut du navigateur : sinon le jeu (100dvh) depasse la page et cree un scroll. */
      html, body { margin: 0; padding: 0; height: 100%; background: #0d0a2a; overflow: hidden; }
      #root { height: 100%; }
      /* Mobile uniquement : l'accueil/le salon peuvent depasser la hauteur de l'ecran (clavier, petit
         telephone...) ; sans scroll possible, le bouton "Jouer" en bas devient inatteignable. */
      @media (max-width: 899px), (max-height: 559px) {
        html, body { overflow-y: auto; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
